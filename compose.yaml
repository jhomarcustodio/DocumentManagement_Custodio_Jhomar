# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  sdms.api:
    image: sdms.api
    build:
      context: .
      dockerfile: SDMS.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - 5000:8080
    depends_on:
      sdms.db:
        condition: service_healthy

  sdms.db:
    image: postgres
    environment:
      - POSTGRES_DB=sdms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/postgres_data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdms"]
      interval: 5s
      timeout: 5s
      retries: 5
  
